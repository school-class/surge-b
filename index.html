<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surge Browser</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="browser-container">
        <!-- Tab Bar -->
        <div id="tab-bar">
            <div id="tabs">
                <!-- Tabs will be injected here -->
            </div>
            <button id="new-tab-btn" title="新規タブ"><i class="fas fa-plus"></i></button>
        </div>

        <!-- Toolbar -->
        <div id="toolbar">
            <div id="mobile-tab-btn" class="mobile-only" title="タブ切替">
                <span id="tab-count-badge">1</span>
            </div>
            <div class="nav-buttons">
                <button id="back-btn" title="戻る"><i class="fas fa-arrow-left"></i></button>
                <button id="forward-btn" title="進む"><i class="fas fa-arrow-right"></i></button>
                <button id="reload-btn" title="再読み込み"><i class="fas fa-redo"></i></button>
                <button id="home-btn" title="ホーム"><i class="fas fa-home"></i></button>
            </div>
            <div id="address-bar-container">
                <i class="fas fa-lock" id="ssl-icon"></i>
                <input type="text" id="address-bar" placeholder="URLを入力または検索" autocomplete="off">
                <button id="bookmark-btn" title="ブックマークに追加"><i class="far fa-star"></i></button>
            </div>
            <div class="menu-buttons">
                <button id="history-menu-btn" title="履歴"><i class="fas fa-history"></i></button>
                <button id="bookmarks-menu-btn" title="ブックマーク"><i class="fas fa-bookmarks"></i></button>
                <button id="settings-btn" title="設定"><i class="fas fa-ellipsis-v"></i></button>
            </div>
        </div>

        <!-- Content Area -->
        <div id="content-area">
            <!-- Iframes for each tab will be injected here -->
        </div>

        <!-- Mobile Tab Switcher Overlay -->
        <div id="tab-switcher-overlay" class="hidden">
            <div class="switcher-header">
                <button id="close-switcher-btn"><i class="fas fa-times"></i></button>
                <h2>タブ</h2>
                <button id="new-tab-switcher-btn"><i class="fas fa-plus"></i></button>
            </div>
            <div id="tab-grid">
                <!-- Tab cards will be injected here -->
            </div>
        </div>

        <!-- Settings Sidebar -->
        <div id="settings-sidebar" class="hidden">
            <div class="sidebar-header">
                <h3>設定</h3>
                <button id="close-settings-btn"><i class="fas fa-times"></i></button>
            </div>
            <div class="settings-content">
                <div class="setting-item">
                    <span>ダークモード</span>
                    <label class="switch">
                        <input type="checkbox" id="dark-mode-toggle">
                        <span class="slider round"></span>
                    </label>
                </div>
                <div class="setting-item">
                    <span>検索エンジン</span>
                    <select id="search-engine-select">
                        <option value="google">Google</option>
                        <option value="bing">Bing</option>
                        <option value="duckduckgo">DuckDuckGo</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- History Sidebar -->
        <div id="history-sidebar" class="hidden">
            <div class="sidebar-header">
                <h3>履歴</h3>
                <button id="close-history-btn"><i class="fas fa-times"></i></button>
            </div>
            <ul id="history-list">
                <!-- History will be injected here -->
            </ul>
        </div>

        <!-- Bookmarks Sidebar (Hidden by default) -->
        <div id="bookmarks-sidebar" class="hidden">
            <div class="sidebar-header">
                <h3>ブックマーク</h3>
                <button id="close-bookmarks-btn"><i class="fas fa-times"></i></button>
            </div>
            <ul id="bookmarks-list">
                <!-- Bookmarks will be injected here -->
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
