<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新規タブ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        html, body {
            height: 100%;
            width: 100%;
        }
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100%;
            background-color: #f8f9fa;
            box-sizing: border-box;
        }
        .logo {
            font-size: 64px;
            font-weight: bold;
            color: #4285f4;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        @media (max-width: 600px) {
            .logo {
                font-size: 48px;
                margin-bottom: 20px;
            }
            .shortcuts {
                grid-template-columns: repeat(2, 1fr) !important;
                gap: 15px !important;
            }
            .search-container {
                width: 95%;
            }
            input {
                padding: 12px 15px 12px 40px;
                font-size: 14px;
            }
        }
        .search-container {
            width: 90%;
            max-width: 600px;
            position: relative;
        }
        input {
            width: 100%;
            padding: 15px 20px 15px 50px;
            font-size: 16px;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            outline: none;
            box-shadow: 0 1px 6px rgba(32,33,36,0.28);
        }
        .fa-search {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #9aa0a6;
        }
        .shortcuts {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-top: 40px;
        }
        .shortcut {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #3c4043;
            transition: transform 0.2s;
        }
        .shortcut:hover {
            transform: translateY(-5px);
        }
        .icon-box {
            width: 48px;
            height: 48px;
            background: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 8px;
            font-size: 20px;
        }
        span {
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="logo">
        <i class="fas fa-wind"></i>
        Surge
    </div>
    <div class="search-container">
        <i class="fas fa-search"></i>
        <input type="text" id="search-input" placeholder="Google で検索または URL を入力" autofocus>
    </div>
    <div class="shortcuts">
        <a href="https://www.google.com" class="shortcut">
            <div class="icon-box"><i class="fab fa-google" style="color: #4285f4;"></i></div>
            <span>Google</span>
        </a>
        <a href="https://www.youtube.com" class="shortcut">
            <div class="icon-box"><i class="fab fa-youtube" style="color: #ff0000;"></i></div>
            <span>YouTube</span>
        </a>
        <a href="https://github.com" class="shortcut">
            <div class="icon-box"><i class="fab fa-github"></i></div>
            <span>GitHub</span>
        </a>
        <a href="https://twitter.com" class="shortcut">
            <div class="icon-box"><i class="fab fa-twitter" style="color: #1da1f2;"></i></div>
            <span>Twitter</span>
        </a>
    </div>

    <script>
        const searchInput = document.getElementById('search-input');

        function updatePlaceholder() {
            const engine = localStorage.getItem('searchEngine') || 'google';
            const engineName = engine.charAt(0).toUpperCase() + engine.slice(1);
            searchInput.placeholder = `${engineName} で検索または URL を入力`;
        }

        // Update placeholder based on selected engine
        updatePlaceholder();

        // Listen for storage changes from other tabs/shell
        window.addEventListener('storage', (e) => {
            if (e.key === 'searchEngine') {
                updatePlaceholder();
            }
        });

        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const query = searchInput.value.trim();
                if (query === '') return;

                if (query.includes('.') && !query.includes(' ')) {
                    window.location.href = query.startsWith('http') ? query : 'https://' + query;
                } else {
                    const engine = localStorage.getItem('searchEngine') || 'google';
                    let searchUrl;
                    switch(engine) {
                        case 'bing':
                            searchUrl = 'https://www.bing.com/search?q=' + encodeURIComponent(query);
                            break;
                        case 'duckduckgo':
                            searchUrl = 'https://duckduckgo.com/?q=' + encodeURIComponent(query);
                            break;
                        case 'surge':
                            searchUrl = 'https://www.surge.f5.si/s/search.html?q=' + encodeURIComponent(query);
                            break;
                        default: // google
                            searchUrl = 'https://www.google.com/search?q=' + encodeURIComponent(query) + '&igu=1';
                    }
                    window.location.href = searchUrl;
                }
            }
        });
    </script>
</body>
</html>
